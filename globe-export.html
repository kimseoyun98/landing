<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Eromnet Hero — 구면 투영</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    #globe-canvas { position: fixed; top: 0; left: 0; display: block; cursor: grab; }
    #globe-canvas:active { cursor: grabbing; }
  </style>
</head>
<body>

<canvas id="globe-canvas"></canvas>

<script>
'use strict';

// ── 고정 파라미터 (컨트롤 패널에서 확정한 값) ──────────────────────────────
const PARAMS = {
  cL: '#FF7300',   // 육지 색
  cS: '#000000',   // 바다 색
  aL: 1,           // 육지 투명도 100%
  aS: 1,           // 바다 투명도 100%
  bg: '#ffffff',   // 바깥 배경
  ac: '#FF7300',   // 아크 색
  arcsOn: true,    // 아크 표시
  sizeScale: 0.69, // 요소 크기 69%
  fw: 800,         // 글자 굵기
  to: 1,           // 글자 선명도 100%
  fill: 1.14,      // 글자 채움 114%
  style: 'stroke', // 스타일
  sw: 0,           // 선 두께
  blink: true,     // 깜박임
  sp: 2,           // 회전 속도
};

// ── Shared ──────────────────────────────────────────────────────────────
const EARTH_URL = 'public/earth-mask.jpg';
const CHARS     = ['$','€','£','¥','₩','₹'];
const CHINA_EU  = 0.5 + 104 / 360;
const DPR       = window.devicePixelRatio || 1;

let earthData=null, earthW=0, earthH=0, earthReady=false;

function loadEarth(cb) {
  const img = new Image(); img.crossOrigin='anonymous'; img.src=EARTH_URL;
  img.onload = () => {
    const off=document.createElement('canvas');
    off.width=img.naturalWidth; off.height=img.naturalHeight;
    const oc=off.getContext('2d'); oc.drawImage(img,0,0);
    const d=oc.getImageData(0,0,img.naturalWidth,img.naturalHeight);
    earthData=d.data; earthW=img.naturalWidth; earthH=img.naturalHeight;
    earthReady=true; cb();
  };
}

const canvas=document.getElementById('globe-canvas');
const ctx=canvas.getContext('2d');
let W=window.innerWidth, H=window.innerHeight, CX=W/2, CY=H/2, SIZE=Math.min(W,H), R=(SIZE/2)*0.88;

function resize() {
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H/2; SIZE=Math.min(W,H); R=(SIZE/2)*0.88;
}
window.addEventListener('resize', resize);
resize();

// ── Globe: orthographic sphere ────────────────────────────────────────
// 축 방향 행렬 — 드래그로 굴려서 조절 (기본: 18° 기울기)
let M2;
function resetTilt2(){const t=18*Math.PI/180,c=Math.cos(t),s=Math.sin(t);M2=[1,0,0, 0,c,-s, 0,s,c];}
resetTilt2();
// 화면 기준 트랙볼: 세로 드래그(dy) = 화면 X축 회전, 가로 드래그(dx) = 화면 Y축 회전 (라디안)
function rollAxis2(dx,dy){
  let [a,b,c1, d,e,f, g,h,i]=M2;
  const cx=Math.cos(dy),sx=Math.sin(dy);
  let d2=cx*d-sx*g, e2=cx*e-sx*h, f2=cx*f-sx*i;
  let g2v=sx*d+cx*g, h2=sx*e+cx*h, i2=sx*f+cx*i;
  d=d2;e=e2;f=f2;g=g2v;h=h2;i=i2;
  const cy=Math.cos(dx),sy=Math.sin(dx);
  const a2=cy*a+sy*g, b2=cy*b+sy*h, c2=cy*c1+sy*i;
  const g3=-sy*a+cy*g, h3=-sy*b+cy*h, i3=-sy*c1+cy*i;
  M2=[a2,b2,c2, d,e,f, g3,h3,i3];
}
function applyM2(x3,y3,z3){
  return {
    x:M2[0]*x3+M2[1]*y3+M2[2]*z3,
    y:M2[3]*x3+M2[4]*y3+M2[5]*z3,
    z:M2[6]*x3+M2[7]*y3+M2[8]*z3,
  };
}

const NEO_CITIES=[
  [37.57,126.98],[35.68,139.69],[31.23,121.47],[39.90,116.41],[22.32,114.17],
  [1.35,103.82],[13.76,100.50],[-33.87,151.21],[28.61,77.21],[19.08,72.88],
  [25.20,55.27],[30.04,31.24],[51.51,-0.13],[48.86,2.35],[52.52,13.41],
  [55.76,37.62],[59.33,18.07],[40.71,-74.01],[34.05,-118.24],[41.88,-87.63],
  [43.65,-79.38],[19.43,-99.13],[-23.55,-46.63],[-34.60,-58.38],[6.52,3.38],
  [-26.20,28.05],[4.71,-74.07],
].map(([la,lo])=>({lat:la*Math.PI/180,lon:lo*Math.PI/180}));

class Globe {
  constructor(rows,cols) { this.scrollU=0;this.glyphs=[];this.arcs=[];this.arcTimer=0;this._build(rows,cols); }
  _build(rows=65,cols=130) {
    if (!earthReady) return; this.glyphs=[];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
      const eu=c/cols, ev=r/rows;
      const px=Math.min(Math.floor(eu*earthW),earthW-1);
      const py=Math.min(Math.floor(ev*earthH),earthH-1);
      this.glyphs.push({eu,ev,isLand:(earthData[(py*earthW+px)*4]??0)<128,
        char:CHARS[Math.floor(Math.random()*6)],variation:Math.random()});
    }
    this._rows=rows; this._cols=cols;
  }
  _proj(lat,lon) {
    // 위도/경도 → 회전 투영 좌표
    const eu=lon/(Math.PI*2)+0.5;
    const rawU=(eu-CHINA_EU+0.5-this.scrollU+100)%1;
    const delta=(rawU-0.5)*Math.PI*2;
    const cosLat=Math.cos(lat);
    const x3=cosLat*Math.sin(delta), y3=Math.sin(lat), z3=cosLat*Math.cos(delta);
    const v=applyM2(x3,y3,z3);
    return {sx:CX+R*v.x, sy:CY-R*v.y, z:v.z};
  }
  _spawnArc() {
    const a=Math.floor(Math.random()*NEO_CITIES.length);
    let b; do{b=Math.floor(Math.random()*NEO_CITIES.length);}while(b===a);
    this.arcs.push({from:NEO_CITIES[a],to:NEO_CITIES[b],t:0,dur:1.6+Math.random()*1.2,alpha:0});
  }
  draw(dt,sp,cL,cS,aL,aS,bg,ac,style='stroke',sw=1.2,fw=600,to=0.85,fill=1,blink=true,arcsOn=true) {
    this.scrollU=(this.scrollU+(1/24)*sp*dt)%1;
    const scale=(R*2)/earthH;
    const rows=this._rows||65;
    const circleR=Math.max(4,(earthH*scale/rows)*0.49), fs=Math.round(circleR*1.1*fill);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
    if (!this.glyphs.length) return;
    ctx.font=`${fw} ${fs}px 'Inter',sans-serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.lineWidth=sw;
    const m0b=ctx.measureText('$'); const yFixB=(m0b.actualBoundingBoxAscent-m0b.actualBoundingBoxDescent)/2;
    for (const g of this.glyphs) {
      const lat=(0.5-g.ev)*Math.PI, cosLat=Math.cos(lat);
      if (g.variation>cosLat*cosLat*1.15) continue;
      const rawU=(g.eu-CHINA_EU+0.5-this.scrollU+100)%1;
      const delta=(rawU-0.5)*Math.PI*2;
      const x3=cosLat*Math.sin(delta),y3=Math.sin(lat),z3=cosLat*Math.cos(delta);
      const v=applyM2(x3,y3,z3), z2=v.z;
      if (z2<=0) continue;
      if (blink && (g.variation*13.71)%1 > Math.abs(Math.cos(delta))*1.2) continue;
      const sx=CX+R*v.x, sy=CY-R*v.y;
      const base=g.isLand?(0.72+g.variation*0.28)*aL:(0.06+g.variation*0.12)*aS;
      const alpha=Math.min(1,base*(0.35+0.65*z2)*to);
      if (alpha<=0.003) continue;
      const rr=circleR*(0.55+0.45*z2);
      const color=g.isLand?cL:cS;
      ctx.globalAlpha=alpha;
      if (style==='filled') {
        ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
        if(fs>0){ctx.fillStyle=bg; ctx.fillText(g.char,sx,sy+yFixB);}
      } else if (style==='tinted') {
        ctx.globalAlpha=alpha*0.3;
        ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
        ctx.globalAlpha=alpha;
        if(sw>0){ctx.strokeStyle=color; ctx.stroke();}
        if(fs>0){ctx.fillStyle=color; ctx.fillText(g.char,sx,sy+yFixB);}
      } else {
        ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
        if(sw>0){ctx.strokeStyle=color; ctx.stroke();}
        if(fs>0){ctx.fillStyle=color; ctx.fillText(g.char,sx,sy+yFixB);}
      }
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=1;
    // 아크
    if (!arcsOn){this.arcs.length=0;return;}
    this.arcTimer+=dt;
    if (this.arcTimer>0.7){this.arcTimer=0;if(this.arcs.length<7)this._spawnArc();}
    this.arcs=this.arcs.filter(a=>a.t<a.dur);
    for(const arc of this.arcs){
      arc.t+=dt; arc.alpha=Math.min(1,arc.t/0.3)*Math.min(1,(arc.dur-arc.t)/0.3);
      const pA=this._proj(arc.from.lat,arc.from.lon-Math.PI);
      const pB=this._proj(arc.to.lat,arc.to.lon-Math.PI);
      if(pA.z<=0||pB.z<=0) continue;
      const mx=(pA.sx+pB.sx)/2, my=(pA.sy+pB.sy)/2;
      const d=Math.hypot(pB.sx-pA.sx,pB.sy-pA.sy);
      const cx2=mx, cy2=my-d*0.45;
      const prog=arc.t/arc.dur;
      ctx.save(); ctx.globalAlpha=arc.alpha*0.7;
      ctx.strokeStyle=ac||cL; ctx.lineWidth=1.5;
      ctx.shadowColor=ac||cL; ctx.shadowBlur=8;
      ctx.beginPath();
      const steps=40;
      for(let i=0;i<=Math.round(steps*prog);i++){
        const tt=i/steps;
        const bx=(1-tt)*(1-tt)*pA.sx+2*(1-tt)*tt*cx2+tt*tt*pB.sx;
        const by=(1-tt)*(1-tt)*pA.sy+2*(1-tt)*tt*cy2+tt*tt*pB.sy;
        i===0?ctx.moveTo(bx,by):ctx.lineTo(bx,by);
      }
      ctx.stroke();
      // 도시 마커
      ctx.shadowBlur=0;
      ctx.globalAlpha=pA.z*(ac||cL?0.9:0.5); ctx.strokeStyle=ac||cL; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(pA.sx,pA.sy,3,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=pB.z*(ac||cL?0.9:0.5);
      ctx.beginPath(); ctx.arc(pB.sx,pB.sy,3,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}

// ── Main loop ───────────────────────────────────────────────────────────
let globe=null, lastT=0;

function loop(now) {
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  if (!earthReady){requestAnimationFrame(loop);return;}
  globe.draw(dt,PARAMS.sp,PARAMS.cL,PARAMS.cS,PARAMS.aL,PARAMS.aS,PARAMS.bg,PARAMS.ac,PARAMS.style,PARAMS.sw,PARAMS.fw,PARAMS.to,PARAMS.fill,PARAMS.blink,PARAMS.arcsOn);
  requestAnimationFrame(loop);
}

function init() {
  const sc=PARAMS.sizeScale;
  const rows=Math.max(8,Math.round(65/sc)), cols=Math.max(8,Math.round(130/sc));
  globe=new Globe(rows,cols);
  lastT=performance.now(); requestAnimationFrame(loop);
}

loadEarth(init);

// ── 드래그로 축 굴리기 (더블클릭 = 리셋) ──────────────────────────────────
const ROT_SPEED=0.005; // rad/px
let drag=null;
canvas.addEventListener('mousedown', e=>{
  if (e.button!==0) return;
  drag={lx:e.clientX, ly:e.clientY};
});
window.addEventListener('mousemove', e=>{
  if (!drag) return;
  rollAxis2((e.clientX-drag.lx)*ROT_SPEED,(e.clientY-drag.ly)*ROT_SPEED);
  drag.lx=e.clientX; drag.ly=e.clientY;
});
window.addEventListener('mouseup', ()=>{ drag=null; });
canvas.addEventListener('dblclick', ()=>{ resetTilt2(); });

canvas.addEventListener('touchstart', e=>{
  if (e.touches.length===1) drag={lx:e.touches[0].clientX, ly:e.touches[0].clientY};
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  if (e.touches.length===1 && drag) {
    e.preventDefault();
    rollAxis2((e.touches[0].clientX-drag.lx)*ROT_SPEED,(e.touches[0].clientY-drag.ly)*ROT_SPEED);
    drag.lx=e.touches[0].clientX; drag.ly=e.touches[0].clientY;
  }
},{passive:false});
canvas.addEventListener('touchend', ()=>{ drag=null; },{passive:true});
</script>
</body>
</html>
